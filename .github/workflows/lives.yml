# Lives -> clips : le bot lit lui-même les lives FR en cours sur le jeu (VOD du live),
# repère les moments drôles dans la transcription et ne monte que ceux notés 7/10 ou plus.
# Toutes les heures (à :45), ou à la main : Actions > Lives > Run workflow.
name: Lives
on:
  # PAUSE du 22/11 (demande : « mets le clipping sur pause indéfiniment ») :
  # schedule:
  #   - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Nombre de lives regardés (les plus regardés)"
        default: "4"
      streamers:
        description: "Logins Twitch précis, séparés par des virgules (vide = les plus regardés)"
        default: ""
      fenetre:
        description: "Minutes de VOD lues au maximum par streamer"
        default: "60"
      enregistrement:
        description: "Minutes de live enregistrées quand la VOD est réservée aux abonnés"
        default: "40"

permissions:
  contents: read
  actions: write   # pour se relancer lui-même (le cron de GitHub ne se déclenche presque jamais)

jobs:
  lives:
    if: ${{ vars.STOP != '1' && vars.LIVES != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: lives
      cancel-in-progress: false
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || '7t3dj86daadls0hj8rru2y2nuxxx2z' }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      STOP: ${{ vars.STOP }}
      GAME_NAME: ${{ vars.GAME_NAME || 'Grand Theft Auto VI' }}
      STREAM_LANG: fr
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'large-v3-turbo' }}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      FONTCONFIG_FILE: /etc/fonts/fonts.conf
      LIVE_TOP: ${{ inputs.top || '4' }}
      LIVE_STREAMERS: ${{ inputs.streamers }}
      LIVE_WINDOW_MIN: ${{ inputs.fenetre || '60' }}
      LIVE_RECORD_MIN: ${{ inputs.enregistrement || '40' }}
    steps:
      - name: Heure de départ
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (cache)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: ffmpeg
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            mkdir -p ~/ffmpeg /tmp/ffx
            curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            || curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp/ffx
            cp "$(find /tmp/ffx -type f -name ffmpeg | head -1)" "$(find /tmp/ffx -type f -name ffprobe | head -1)" ~/ffmpeg/
            chmod +x ~/ffmpeg/*
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - name: Dépendances
        run: pip install -q -r requirements.txt && pip install -q -U "yt-dlp[default]" streamlink
      - name: Modèles Whisper (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-yt-${{ env.WHISPER_MODEL }}
      - name: Compteurs des garde-fous (cache du jour)
        id: usage
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/usage.json
          key: usage-${{ steps.usage.outputs.day }}-${{ github.run_id }}
          restore-keys: usage-${{ steps.usage.outputs.day }}-
      - name: Lecture des lives
        timeout-minutes: 85
        run: python -m gta_clipper lives
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/usage.json
          key: usage-${{ steps.usage.outputs.day }}-${{ github.run_id }}
      - name: Se relancer
        if: ${{ false }}  # PAUSE du 22/11 : ne se relance plus (remettre !cancelled() pour reprendre)   # annuler le run à la main arrête la boucle (variable LIVES=off aussi)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Pas de live / passage très court : on attend un peu avant le suivant (15 min minimum entre deux départs).
          left=$(( T0 + 900 - $(date +%s) ))
          if [ "$left" -gt 0 ]; then echo "Pause de $left s"; sleep "$left"; fi
          gh workflow run lives.yml --ref "${{ github.ref_name }}" \
            -f top="${LIVE_TOP}" -f fenetre="${LIVE_WINDOW_MIN}" -f enregistrement="${LIVE_RECORD_MIN}"
