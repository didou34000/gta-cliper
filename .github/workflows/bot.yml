# Fait tourner le bot sur les serveurs de GitHub, sans rien installer chez toi.
# Les clés sont dans Settings > Secrets and variables > Actions (jamais dans le code).
name: Bot GTA Clipper
on:
  # Toutes les 20 minutes, GitHub regarde la programmation réglée sur le site.
  # Si elle est arrêtée (réglage par défaut), le contrôle s'arrête en quelques secondes
  # sans rien lancer.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:       # bouton « Lancer » du site, ou « Run workflow » sur GitHub
    inputs:
      jeu:
        description: "Jeu (nom exact sur Twitch), ou « tous » pour tous les jeux"
        default: "Grand Theft Auto VI"
      top_streamers:
        description: "Prendre les N plus gros streamers FR du jeu (0 = utiliser la liste)"
        default: "8"
      streamers:
        description: "Logins Twitch séparés par des virgules (si top_streamers = 0)"
        default: ""
      max_clips:
        description: "Nombre max de clips pour ce passage"
        default: "3"
      min_views:
        description: "Vues minimum d'un clip Twitch pour être pris"
        default: "200"
      heures:
        description: "Chercher les clips des N dernières heures (1 à 720)"
        default: "48"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.plan.outputs.run }}
      jeu: ${{ steps.plan.outputs.jeu }}
      top: ${{ steps.plan.outputs.top }}
      max_clips: ${{ steps.plan.outputs.max_clips }}
      min_views: ${{ steps.plan.outputs.min_views }}
      heures: ${{ steps.plan.outputs.heures }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Est-ce l'heure d'un passage ?
        id: plan
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          IN_JEU: ${{ inputs.jeu }}
          IN_TOP: ${{ inputs.top_streamers }}
          IN_MAX: ${{ inputs.max_clips }}
          IN_MIN: ${{ inputs.min_views }}
          IN_HEURES: ${{ inputs.heures }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 -m gta_clipper.schedule
          else
            { echo "run=true"; echo "jeu=$IN_JEU"; echo "top=${IN_TOP:-8}"; echo "max_clips=${IN_MAX:-3}"; echo "min_views=${IN_MIN:-200}"; echo "heures=${IN_HEURES:-48}"; } >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50       # garde-fou : un passage bloqué est coupé
    concurrency:
      group: bot
      cancel-in-progress: false  # jamais deux passages en même temps
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || '7t3dj86daadls0hj8rru2y2nuxxx2z' }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      STOP: ${{ vars.STOP }}               # variable STOP=1 : arrêt d'urgence
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'large-v3-turbo' }}
      GAME_NAME: ${{ needs.check.outputs.jeu }}
      TOP_STREAMERS: ${{ needs.check.outputs.top }}
      STREAMERS: ${{ inputs.streamers }}
      MAX_CLIPS: ${{ needs.check.outputs.max_clips || '3' }}
      MIN_VIEWS: ${{ needs.check.outputs.min_views || '200' }}
      HOURS: ${{ needs.check.outputs.heures || '48' }}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      FONTCONFIG_FILE: /etc/fonts/fonts.conf   # pour le ffmpeg statique
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ffmpeg en binaire statique, gardé en cache : plus d'apt-get (les miroirs Ubuntu
      # et le verrou dpkg des machines neuves bloquaient parfois plusieurs minutes).
      - name: ffmpeg (cache)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: ffmpeg
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            mkdir -p ~/ffmpeg /tmp/ffx
            curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            || curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp/ffx
            cp "$(find /tmp/ffx -type f -name ffmpeg | head -1)" "$(find /tmp/ffx -type f -name ffprobe | head -1)" ~/ffmpeg/
            chmod +x ~/ffmpeg/*
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          ~/ffmpeg/ffmpeg -version | head -1
          fc-list | grep -i "DejaVu Sans" | head -1 || echo "::warning::police DejaVu absente : police par défaut"
      - name: Dépendances
        run: pip install -q -r requirements.txt
      - name: Modèle Whisper (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}
      - name: Compteurs des garde-fous (cache du jour)
        id: usage
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/usage.json
          key: usage-${{ steps.usage.outputs.day }}-${{ github.run_id }}
          restore-keys: usage-${{ steps.usage.outputs.day }}-
      - name: Vérifier les clés
        run: |
          if [ -z "$TWITCH_CLIENT_SECRET" ]; then echo "::error::Secret TWITCH_CLIENT_SECRET manquant"; exit 1; fi
          if [ -z "$R2_SECRET_ACCESS_KEY" ]; then echo "::warning::Clés R2 manquantes (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PUBLIC_URL) : rien ne sera envoyé au site"; fi
      - name: Passage du bot
        run: python -m gta_clipper run
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/usage.json
          key: usage-${{ steps.usage.outputs.day }}-${{ github.run_id }}
