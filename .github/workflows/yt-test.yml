# Lien YouTube -> clips (façon Opus Clip). Lancé par le site (Programmation > Lien YouTube)
# ou à la main : Actions > Lien YouTube > Run workflow.
# YouTube bloque souvent les serveurs GitHub (« confirm you're not a bot ») : le secret
# YT_COOKIES (contenu d'un cookies.txt d'un compte YouTube jetable) aide. Sinon, lance la
# même chose depuis le Mac : python -m gta_clipper youtube <lien>
name: Test YouTube (temporaire)
on:
  push:
    branches: [claude/project-thread-uxcv0v]
    paths: [.github/workflows/yt-test.yml]
  workflow_dispatch:
    inputs:
      url:
        description: "Lien de la vidéo YouTube"
        required: true
      clips:
        description: "Nombre de clips à sortir (1 à 8)"
        default: "3"
      jeu:
        description: "Jeu de la vidéo (nom Twitch), ou « tous »"
        default: "Grand Theft Auto VI"
      streamer:
        description: "Nom affiché dans les titres (vide = nom de la chaîne)"
        default: ""

permissions:
  contents: read

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: bot
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      STOP: ${{ vars.STOP }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'large-v3-turbo' }}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      FONTCONFIG_FILE: /etc/fonts/fonts.conf
      IN_URL: ${{ inputs.url }}  # vide au push : on prend une vidéo trouvée par recherche
      IN_CLIPS: ${{ inputs.clips }}
      IN_JEU: ${{ inputs.jeu }}
      IN_STREAMER: ${{ inputs.streamer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2   # yt-dlp en a besoin pour YouTube
        with:
          deno-version: v2.x
      - name: ffmpeg (cache)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: ffmpeg
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            mkdir -p ~/ffmpeg /tmp/ffx
            curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            || curl -fsSL --retry 3 --max-time 150 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp/ffx
            cp "$(find /tmp/ffx -type f -name ffmpeg | head -1)" "$(find /tmp/ffx -type f -name ffprobe | head -1)" ~/ffmpeg/
            chmod +x ~/ffmpeg/*
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - name: Dépendances
        run: pip install -q -r requirements.txt && pip install -q -U "yt-dlp[default]"
      - name: Modèles Whisper (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-yt-${{ env.WHISPER_MODEL }}
      - name: Compteurs des garde-fous (cache du jour)
        id: usage
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/usage.json
          key: usage-${{ steps.usage.outputs.day }}-${{ github.run_id }}
          restore-keys: usage-${{ steps.usage.outputs.day }}-
      - name: Clips depuis le lien YouTube
        run: |
          U="${IN_URL}"
          if [ -z "$U" ]; then U="https://www.youtube.com/watch?v=$(yt-dlp --print id 'ytsearch1:GTA 5 RP réaction fou rire streamer français' | head -1)"; fi
          echo "Vidéo testée : $U"
          python -m gta_clipper -v youtube "$U" --clips 2 --jeu "Grand Theft Auto V"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: |
            data/review/*/clip.mp4
            data/review/*/meta.json
          if-no-files-found: ignore
