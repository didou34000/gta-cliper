# Test temporaire : YouTube laisse-t-il télécharger depuis les serveurs GitHub ?
name: Test YouTube (temporaire)
on:
  push:
    branches: [claude/project-thread-uxcv0v]
    paths: [.github/workflows/yt-test.yml]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: { essai: [1, 2, 3] }
    steps:
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -q -U "yt-dlp[default]"
      - name: Son seul (video GTA longue)
        continue-on-error: true
        run: yt-dlp -f "ba/b" -o a.%(ext)s "https://www.youtube.com/watch?v=QdBZY2fkU-0" 2>&1 | tail -4; ls -la a.* || true
      - name: Section video 30 s
        continue-on-error: true
        run: yt-dlp -f "bv*[height<=1080]+ba/b" --download-sections "*60-90" -o t2.mp4 "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | tail -4; ls -la t2* || true
