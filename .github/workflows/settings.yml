# Change les réglages du site sans ouvrir le site (champ vide = inchangé).
name: Réglages
on:
  workflow_dispatch:
    inputs:
      programmation: { description: "Programmation : on / off (vide = inchangé)", default: "" }
      langue: { description: "Langue des streamers : fr, en, es, pt, de, it, ja, ko, any", default: "" }
      jeu: { description: "Jeu Twitch (ex. Grand Theft Auto VI, ou « tous »)", default: "" }
      every_min: { description: "Un passage toutes les N min (10 à 360)", default: "" }
      max_clips: { description: "Clips max par passage (1 à 10)", default: "" }
      top: { description: "Nombre de streamers suivis (1 à 20)", default: "" }
      min_views: { description: "Vues minimum d'un clip", default: "" }
      heures: { description: "Fenêtre en heures (1 à 720)", default: "" }
      auto_min: { description: "Validation auto si potentiel ≥ N/10 (0 = jamais)", default: "" }
      publish_every_min: { description: "Un post toutes les N min (10 à 720)", default: "" }
      jours: { description: "Jours des passages : tous, ou ex. lun,mar,mer (0 = dimanche)", default: "" }
      publication: { description: "Publication auto Buffer : on / off (vide = inchangé)", default: "" }
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m gta_clipper.settings
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SET_PROGRAMMATION: ${{ inputs.programmation }}
          SET_JEU: ${{ inputs.jeu }}
          SET_LANGUE: ${{ inputs.langue }}
          SET_EVERY_MIN: ${{ inputs.every_min }}
          SET_MAX_CLIPS: ${{ inputs.max_clips }}
          SET_TOP: ${{ inputs.top }}
          SET_MIN_VIEWS: ${{ inputs.min_views }}
          SET_HOURS: ${{ inputs.heures }}
          SET_AUTO_MIN: ${{ inputs.auto_min }}
          SET_PUBLISH_EVERY_MIN: ${{ inputs.publish_every_min }}
          SET_PUBLICATION: ${{ inputs.publication }}
          SET_JOURS: ${{ inputs.jours }}
