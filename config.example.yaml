# Jeu ciblé (nom exact sur Twitch). Les clips/VODs d'un autre jeu sont ignorés.
game_name: "Grand Theft Auto VI"

# Fenêtre de recherche des clips (heures en arrière).
lookback_hours: 48

# Combien de clips max à produire par streamer et par passage.
max_clips_per_streamer: 5

# Clips Twitch : vues minimum pour être retenu.
min_clip_views: 200

# Clips plus courts que ça (secondes) ignorés.
min_clip_duration: 20

# Choix sur l'ensemble des streamers : au plus N clips du même streamer par passage,
# et les K plus vus partent en présélection (Claude Haiku note leur potentiel).
max_clips_per_streamer_in_run: 2
preselect_candidates: 12

# Détection sur VOD par pics de chat (optionnel, plus lourd).
vod:
  enabled: false
  max_vods_per_streamer: 1
  window_seconds: 30        # taille de fenêtre de comptage
  min_zscore: 3.0           # sensibilité du pic (plus haut = plus strict)
  clip_before: 20           # secondes gardées avant le pic
  clip_after: 25            # secondes gardées après le pic
  max_highlights_per_vod: 8

# Rendu vertical
render:
  width: 1080
  height: 1920
  layout: blur          # blur = jeu entier au centre + fond flou ; crop = zoom plein écran
  # Facecam (optionnel) : zone de la webcam dans la source 1920x1080, en pixels.
  # Si renseignée, elle est placée en haut de la vidéo verticale.
  facecam: null         # ex: {x: 1440, y: 0, w: 480, h: 270}
  max_duration: 60      # secondes max (Shorts/TikTok/Reels)

# Sous-titres animés mot par mot
subtitles:
  font: "Montserrat Black"     # fournie dans assets/fonts (style CapCut)
  font_size: 92                # taille ajustée : coupe auto si la ligne dépasse le cadre
  words_per_line: 3
  color: "&H00FFFFFF"            # blanc (format ASS &HAABBGGRR)
  highlight_color: "&H00A53EFF"  # rose GTA VI (#FF3EA5) pour le mot prononcé
  outline_color: "&H003D0A2A"    # contour violet nuit (#2A0A3D)
  hook_bg: "&H00A53EFF"          # bandeau de l'accroche rose GTA VI
  hook_fg: "&H00FFFFFF"          # texte de l'accroche blanc
  outline: 6
  position_y: 1350               # hauteur des sous-titres (sur 1920)
  uppercase: true
  hook: true                     # accroche incrustée en haut de la vidéo (bandeau rose GTA VI)
  hook_y: 330                    # hauteur de l'accroche (sur 1920)
  hook_size: 104

# Transcription
whisper:
  model: large-v3-turbo  # presque aussi précis que large-v3, bien plus rapide ; "small" pour tester vite
  device: auto         # auto | cpu | cuda
  compute_type: auto

# Génération du titre / description / hashtags
# Garde-fous (le bot s'arrête proprement et reprend au passage suivant).
# Arrêt d'urgence : crée un fichier STOP dans le dossier du projet.
limits:
  max_new_clips_per_run: 10      # clips fabriqués par passage
  max_new_clips_per_day: 40      # clips fabriqués par jour
  max_llm_calls_per_day: 60      # appels à Claude par jour (au-delà : titre provisoire)
  max_site_uploads_per_day: 600  # envois vers le site par jour
  max_clips_on_site: 20          # au-delà, les plus anciens (rejetés, puis publiés…) sont supprimés
  max_consecutive_errors: 5      # échecs d'affilée avant d'arrêter le passage
  max_download_mb: 400           # taille max d'une vidéo téléchargée

llm:
  model: claude-opus-5-5
  rank_model: claude-haiku-5-5   # présélection bon marché des clips
  base_hashtags: ["#GTA6", "#GTAVI", "#GTA"]

paths:
  work: data/work
  review: data/review       # clips en attente de validation
  approved: data/approved   # clips validés, prêts à poster
  rejected: data/rejected
