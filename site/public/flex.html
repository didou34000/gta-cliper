<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GTA Clipper Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Demo page to screen-record: fake data only, no keys, no network calls. */
:root{
  --bg:#07040d; --panel:rgba(20,11,34,.78); --line:rgba(255,255,255,.09);
  --fg:#fff; --muted:#a99bbf; --pink:#ff3ea5; --violet:#8b5cf6; --sun:#ff9a4d; --ok:#3ef0a0; --red:#ff3b3b; --cyan:#3ec8ff; --amber:#ffc24d;
  --grad:linear-gradient(100deg,#ff3ea5 0%,#ff7a45 55%,#ffc24d 100%);
  --f-d:"Anton",Impact,"Arial Narrow",sans-serif; --f-b:"Inter",system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-b)}
body.nocursor{cursor:none}
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(60% 50% at 90% 110%,rgba(255,62,165,.3),transparent 70%),
  radial-gradient(50% 45% at 0% 0%,rgba(139,92,246,.3),transparent 70%),var(--bg)}
#bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:calc(var(--u)*4) calc(var(--u)*4)}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}

#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,36fr) minmax(0,64fr);grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.6)}
header{grid-column:1/-1;display:flex;align-items:center;gap:calc(var(--u)*2)}
.logo{display:flex;align-items:center;gap:calc(var(--u)*1.1)}
.mark{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:calc(var(--u)*1.1);background:var(--grad);display:grid;place-items:center;font-family:var(--f-d);font-size:calc(var(--u)*2.1);box-shadow:0 0 calc(var(--u)*3) rgba(255,62,165,.55)}
.logo h1{font-family:var(--f-d);font-weight:400;font-size:calc(var(--u)*3.3);letter-spacing:.02em;line-height:.9;text-transform:uppercase}
.logo h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-family:var(--f-m);font-size:calc(var(--u)*.9);color:var(--muted);letter-spacing:.18em;margin-top:calc(var(--u)*.4)}
.auto{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.3);border-radius:99px;border:1px solid rgba(62,240,160,.4);background:rgba(62,240,160,.08);font:700 calc(var(--u)*1.05) var(--f-m);color:var(--ok);letter-spacing:.12em}
.auto i{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--ok);box-shadow:0 0 calc(var(--u)*1.2) var(--ok);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.kpis{margin-left:auto;display:flex;gap:calc(var(--u)*1.1)}
.kpi{padding:calc(var(--u)*.6) calc(var(--u)*1.3);border-radius:calc(var(--u)*1);background:var(--panel);border:1px solid var(--line);text-align:right;min-width:calc(var(--u)*11.5)}
.kpi b{display:block;font-family:var(--f-d);font-weight:400;font-size:calc(var(--u)*2.5);line-height:1;font-variant-numeric:tabular-nums}
.kpi small{font:400 calc(var(--u)*.8) var(--f-m);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.kpi.hot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{position:relative;border-radius:calc(var(--u)*1.3);background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:0}
.ptitle{display:flex;align-items:center;gap:calc(var(--u)*.8);font:700 calc(var(--u)*.95) var(--f-m);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.ptitle i{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:var(--red);animation:blink 1s infinite}
.ptitle em{margin-left:auto;font-style:normal;color:var(--pink)}

/* ---------- LEFT: logs ---------- */
.logs{display:flex;flex-direction:column;padding:calc(var(--u)*1.2) calc(var(--u)*1.3);background:rgba(3,2,6,.82)}
.logs .ptitle{padding-bottom:calc(var(--u)*1);border-bottom:1px solid var(--line)}
.ptitle .dots{display:flex;gap:6px}
.ptitle .dots b{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:#ff5f57}
.ptitle .dots b:nth-child(2){background:#febc2e} .ptitle .dots b:nth-child(3){background:#28c840}
#log{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-top:calc(var(--u)*.8);font:400 calc(var(--u)*1.08) var(--f-m);line-height:1.55;mask-image:linear-gradient(transparent,#000 18%)}
#log div{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfc4e0;animation:fin .18s}
#log .ts{color:#5d5370}
#log .tg{display:inline-block;min-width:8.5ch;font-weight:700}
#log .ok{color:var(--ok)} #log .hl{color:var(--pink);font-weight:700} #log .dim{color:#7d7190} #log .wa{color:var(--amber)}
.t-twitch{color:#a970ff} .t-chat{color:var(--cyan)} .t-crop{color:var(--amber)} .t-whisper{color:#7cf2ff} .t-render{color:var(--sun)} .t-claude{color:#d9a0ff} .t-publish{color:var(--ok)} .t-sys{color:#6f6585}
@keyframes fin{from{opacity:0;transform:translateY(5px)}}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--pink);vertical-align:-.2em;animation:blink .8s infinite}

/* ---------- RIGHT ---------- */
.right{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:calc(var(--u)*1.4);min-height:0}
.lives{padding:calc(var(--u)*1.2) calc(var(--u)*1.3);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:calc(var(--u)*1)}
.tile{position:relative;border-radius:calc(var(--u)*.9);overflow:hidden;border:2px solid transparent;transition:border-color .3s,box-shadow .3s;background:#000}
.tile .game{position:absolute;inset:0}
.tile .ov{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85));z-index:3}
.tile .lv{position:absolute;top:7%;left:4%;z-index:4;font:700 calc(var(--u)*.85) var(--f-m);background:var(--red);padding:1px calc(var(--u)*.5);border-radius:3px}
.tile .vw{position:absolute;top:7%;left:calc(4% + var(--u)*4.4);z-index:4;font:700 calc(var(--u)*.85) var(--f-m);background:rgba(0,0,0,.6);padding:1px calc(var(--u)*.5);border-radius:3px;font-variant-numeric:tabular-nums}
.tile .nm{position:absolute;left:4%;bottom:calc(var(--u)*1.6);z-index:4;font-weight:800;font-size:calc(var(--u)*1.35)}
.tile .nm small{display:block;font:400 calc(var(--u)*.8) var(--f-m);color:#d8cde8}
.tile .hype{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*.6);z-index:4;background:rgba(255,255,255,.1)}
.tile .hype i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .3s}
.tile .badge{position:absolute;right:4%;bottom:calc(var(--u)*1.6);z-index:5;font:700 calc(var(--u)*.95) var(--f-m);padding:calc(var(--u)*.35) calc(var(--u)*.8);border-radius:5px;opacity:0;transform:scale(.6);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.tile.spike{border-color:var(--pink);box-shadow:0 0 calc(var(--u)*3) rgba(255,62,165,.6)}
.tile.spike .badge{opacity:1;transform:none;background:var(--pink)}
.tile.clip{border-color:var(--amber);box-shadow:0 0 calc(var(--u)*3) rgba(255,194,77,.5)}
.tile.clip .badge{opacity:1;transform:none;background:var(--amber);color:#1a0d00}
.tile .bracket{position:absolute;inset:8%;z-index:4;opacity:0;transition:opacity .3s;
  background:linear-gradient(var(--pink),var(--pink)) 0 0/14% 2px no-repeat,linear-gradient(var(--pink),var(--pink)) 0 0/2px 20% no-repeat,
  linear-gradient(var(--pink),var(--pink)) 100% 0/14% 2px no-repeat,linear-gradient(var(--pink),var(--pink)) 100% 0/2px 20% no-repeat,
  linear-gradient(var(--pink),var(--pink)) 0 100%/14% 2px no-repeat,linear-gradient(var(--pink),var(--pink)) 0 100%/2px 20% no-repeat,
  linear-gradient(var(--pink),var(--pink)) 100% 100%/14% 2px no-repeat,linear-gradient(var(--pink),var(--pink)) 100% 100%/2px 20% no-repeat}
.tile.spike .bracket{opacity:1}
.tile .cprog{position:absolute;left:0;top:0;height:calc(var(--u)*.45);z-index:6;width:0;background:var(--amber)}

.out{padding:calc(var(--u)*1.2) calc(var(--u)*1.3);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.clips{display:flex;gap:calc(var(--u)*1.2);height:calc(var(--u)*21);overflow:hidden}
.card{flex:none;display:flex;gap:calc(var(--u)*1);width:calc(var(--u)*25);animation:slide .55s cubic-bezier(.2,.9,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(-40%) scale(.9)}}
.ph{flex:none;height:100%;aspect-ratio:9/16;border-radius:calc(var(--u)*1.2);overflow:hidden;position:relative;border:2px solid #2d2440;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.ph .top{position:absolute;left:0;right:0;top:0;height:42%;overflow:hidden;background:radial-gradient(circle at 50% 120%,#3b2a6a,#120a22)}
.ph .bot{position:absolute;left:0;right:0;bottom:0;height:58%;overflow:hidden}
.ph .bot .game{position:absolute;top:0;bottom:0;left:50%;width:316%;transform:translateX(-50%)}
.ph .hook{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:3;width:88%;text-align:center;font-weight:900;font-size:calc(var(--u)*.85);line-height:1.15;background:var(--pink);padding:calc(var(--u)*.35);border-radius:4px;text-transform:uppercase}
.ph .kar{position:absolute;left:4%;right:4%;top:40%;transform:translateY(-50%);z-index:3;text-align:center;font-weight:900;font-size:calc(var(--u)*1.35);line-height:1.1;text-transform:uppercase;
  text-shadow:-2px -2px 0 #3b0f6e,2px -2px 0 #3b0f6e,-2px 2px 0 #3b0f6e,2px 2px 0 #3b0f6e,0 3px 0 #3b0f6e}
.ph .kar span{display:inline-block;margin:0 .1em;transition:transform .1s}
.ph .kar span.cur{color:var(--pink);transform:scale(1.15) rotate(-2deg)}
.ph .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--pink);z-index:4;width:0}
.info{display:flex;flex-direction:column;gap:calc(var(--u)*.7);min-width:0;padding-top:calc(var(--u)*.3)}
.info b{font-weight:800;font-size:calc(var(--u)*1.2);line-height:1.25}
.info .src{font:400 calc(var(--u)*.85) var(--f-m);color:var(--muted)}
.info .pills{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4)}
.info .pills span{font:700 calc(var(--u)*.78) var(--f-m);padding:2px calc(var(--u)*.55);border-radius:99px;border:1px solid rgba(62,240,160,.45);color:var(--ok);background:rgba(62,240,160,.08)}
.info .pills span.sc{border-color:rgba(255,62,165,.5);color:var(--pink);background:rgba(255,62,165,.1)}
.info .v{margin-top:auto;font-family:var(--f-d);font-size:calc(var(--u)*2.6);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.info .v small{display:block;font:400 calc(var(--u)*.75) var(--f-m);color:var(--muted);-webkit-text-fill-color:var(--muted);letter-spacing:.12em}

/* fake game scenery (no game footage) */
.game{overflow:hidden;background:linear-gradient(180deg,#2a0f4f 0%,#8b2a8f 32%,#ff3ea5 52%,#ff9a4d 66%,#ffc24d 70%,#2a6fa8 70.5%,#123a66 100%)}
.game .sun{position:absolute;left:50%;top:42%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#ffe08a,#ff7a45);box-shadow:0 0 40px #ff9a4d;-webkit-mask:repeating-linear-gradient(180deg,#000 0 7%,transparent 7% 9%);mask:repeating-linear-gradient(180deg,#000 0 7%,transparent 7% 9%)}
.game .sea{position:absolute;left:0;right:0;top:70%;bottom:0;background:repeating-linear-gradient(180deg,rgba(255,154,77,.35) 0 2px,transparent 2px 12px);animation:sea 2s linear infinite}
@keyframes sea{to{background-position:0 12px}}
.game .city{position:absolute;left:0;right:0;bottom:30%;height:22%;background:
  linear-gradient(#1a0833,#1a0833) 4% 100%/5% 70% no-repeat,linear-gradient(#1a0833,#1a0833) 11% 100%/4% 100% no-repeat,linear-gradient(#1a0833,#1a0833) 17% 100%/6% 55% no-repeat,
  linear-gradient(#1a0833,#1a0833) 64% 100%/4% 85% no-repeat,linear-gradient(#1a0833,#1a0833) 70% 100%/7% 60% no-repeat,linear-gradient(#1a0833,#1a0833) 79% 100%/3% 95% no-repeat,linear-gradient(#1a0833,#1a0833) 84% 100%/6% 45% no-repeat}
.game svg.palm{position:absolute;bottom:22%;height:62%;fill:#12051f}
.game svg.palm.l{left:-2%} .game svg.palm.r{right:-3%;transform:scaleX(-1);height:52%}
.game .car{position:absolute;bottom:14%;left:20%;width:22%;height:9%;border-radius:40% 50% 12% 12%;background:linear-gradient(#ff3ea5,#a0146a);box-shadow:0 0 20px rgba(255,62,165,.7);animation:car 3.5s ease-in-out infinite alternate}
.game .car::before,.game .car::after{content:"";position:absolute;bottom:-28%;width:20%;aspect-ratio:1;border-radius:50%;background:#0a0410;border:2px solid #444}
.game .car::before{left:12%} .game .car::after{right:12%}
@keyframes car{to{left:56%}}
.game .hud{position:absolute;left:3%;bottom:5%;width:13%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(10,4,20,.6)}
.game .hud::after{content:"";position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;background:var(--pink);transform:translate(-50%,-50%) rotate(45deg)}
.game.night{filter:hue-rotate(200deg) saturate(1.2) brightness(.8)}
.cam{position:absolute;right:3%;top:6%;width:26%;aspect-ratio:4/3;border-radius:5px;overflow:hidden;border:2px solid rgba(255,255,255,.75);background:radial-gradient(circle at 50% 120%,#3b2a6a,#120a22);z-index:2}
.head{position:absolute;left:50%;top:22%;width:32%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--skin,#e9b48f);animation:bob 1.4s ease-in-out infinite}
.body{position:absolute;left:50%;bottom:-12%;width:72%;height:40%;border-radius:50% 50% 0 0;transform:translateX(-50%);background:var(--shirt,var(--pink))}
.phones{position:absolute;left:50%;top:18%;width:44%;height:30%;border:3px solid #111;border-bottom:none;border-radius:50% 50% 0 0;transform:translateX(-50%);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6%)}}

.hint{position:fixed;right:12px;bottom:8px;z-index:70;font:400 11px var(--f-m);color:rgba(255,255,255,.35);transition:opacity .6s}
body.nocursor .hint{opacity:0}

@media (orientation:portrait){
  :root{--u:min(1.9vw,1.05vh)}
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1.3fr) minmax(0,1fr)}
  header{flex-wrap:wrap} .kpis{margin-left:0;width:100%} .kpi{flex:1;min-width:0}
  .right{order:1} .logs{order:2}
  #app{grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr)}
  .clips{height:calc(var(--u)*24)}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="logo"><div class="mark">GC</div><div><h1>GTA <span>Clipper</span></h1><small>AUTONOMOUS GTA VI CLIP ENGINE</small></div></div>
    <div class="auto"><i></i>AUTOPILOT ON</div>
    <div class="kpis">
      <div class="kpi"><b id="k-live">0</b><small>streams watched</small></div>
      <div class="kpi"><b id="k-clips">0</b><small>clips today</small></div>
      <div class="kpi"><b>0 s</b><small>human time</small></div>
      <div class="kpi hot"><b id="k-views">0</b><small>views generated</small></div>
    </div>
  </header>

  <section class="panel logs">
    <div class="ptitle"><span class="dots"><b></b><b></b><b></b></span>clipper@prod ~ live log<em id="rate">0 ev/s</em></div>
    <div id="log"></div>
  </section>

  <div class="right">
    <section class="panel lives">
      <div class="ptitle"><i></i>Live now · GTA VI · watching chat<em id="lcount"></em></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <section class="panel out">
      <div class="ptitle">Output · auto-posted clips<em>TikTok · YouTube Shorts</em></div>
      <div class="clips" id="clips"></div>
    </section>
  </div>
</div>
<div class="scan"></div>
<div class="hint">click = fullscreen · space = pause</div>

<script>
(() => {
const STREAMERS = [
  {n:"Squeezie", skin:"#e9b48f", shirt:"#ff3ea5"},
  {n:"Gotaga", skin:"#d9a07a", shirt:"#2a52ff"},
  {n:"ZeratoR", skin:"#efc2a0", shirt:"#8b5cf6"},
  {n:"Locklear", skin:"#e2ab85", shirt:"#0b8f5a"},
  {n:"Inoxtag", skin:"#c98e6a", shirt:"#111"},
  {n:"Kameto", skin:"#a8704e", shirt:"#ff5757"},
  {n:"Amine", skin:"#b98260", shirt:"#ffc24d"},
  {n:"Ponce", skin:"#eec0a0", shirt:"#3ec8ff"},
];
const IDEAS = [
  {t:"%s discovers the Vice City mansion in GTA 6", h:"He found the mansion", w:["NO","WAY","LOOK","AT","THE","SIZE","OF","THIS","HOUSE","IT'S","A","CASTLE"]},
  {t:"%s robs his first gas station in GTA 6", h:"His first robbery", w:["WAIT","WAIT","HE'S","CALLING","THE","COPS","GO","GO","GO","DRIVE","DRIVE"]},
  {t:"%s gets arrested in 10 seconds in GTA 6", h:"Arrested in 10 seconds", w:["I","DID","NOTHING","OFFICER","I","SWEAR","I","DID","NOTHING"]},
  {t:"%s finds a secret beach in GTA 6", h:"Secret beach found", w:["BRO","THE","WATER","LOOKS","REAL","THIS","IS","INSANE","LOOK"]},
  {t:"%s crashes a jet ski into a yacht in GTA 6", h:"Jet ski vs yacht", w:["HOLD","ON","HOLD","ON","NOOO","THE","YACHT","IT'S","GONE"]},
  {t:"%s tries the gym for the first time in GTA 6", h:"Gym day in Leonida", w:["HE'S","ACTUALLY","GETTING","BIGGER","LOOK","AT","THE","ARMS"]},
  {t:"%s steals a police car in GTA 6", h:"Stole a police car", w:["I","TOOK","THE","COP","CAR","SIRENS","ON","LET'S","GO"]},
];
const NOISE = [
  ["sys","heartbeat ok · workers 7/7 · queue %q"],["twitch","poll /helix/streams game_id=gta6 lang=fr · 200 · %ms ms"],
  ["chat","ingest %c msg/s · window 90s · baseline %b"],["sys","r2 put clips/%id/meta.json · 1.2 kB"],
  ["chat","z-score %z on %s · below threshold"],["twitch","viewer delta %s %d"],["sys","gc · rss %r MB"],
  ["whisper","gpu idle · model warm"],["chat","emote burst KEKW x%k on %s"],["sys","budget llm today $%u / $1.00"],
  ["twitch","clip api rate 58/800 · ok"],["render","ffmpeg pool 2/4 busy"],
];
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("en-US");
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const hex = n => Array.from({length:n},()=>"0123456789abcdef"[ri(0,15)]).join("");
let paused=false;

// ---------- log ----------
const logEl=$("#log"); let evCount=0;
function log(tag,msg){
  if(paused) return;
  const d=document.createElement("div");
  const ts=new Date().toISOString().slice(11,23);
  d.innerHTML=`<span class="ts">${ts}</span> <span class="tg t-${tag}">[${tag}]</span> ${msg}`;
  logEl.appendChild(d); evCount++;
  while(logEl.children.length>70) logEl.firstChild.remove();
}
function noise(){
  const [tag,m]=pick(NOISE);
  log(tag,'<span class="dim">'+m.replace("%q",ri(0,3)).replace("%ms",ri(41,190)).replace("%c",ri(12,90)).replace("%b",rnd(8,30).toFixed(1))
    .replace("%id",hex(8)).replace("%z",rnd(.2,2.4).toFixed(2)).replace(/%s/g,pick(STREAMERS).n).replace("%d",(Math.random()<.5?"+":"-")+ri(10,900))
    .replace("%r",ri(380,520)).replace("%k",ri(8,60)).replace("%u",rnd(.08,.4).toFixed(2))+'</span>');
}
(function loop(){ noise(); setTimeout(loop, rnd(90,380)); })();
setInterval(()=>{$("#rate").textContent=evCount*2+" ev/s";evCount=0},500);

// ---------- scenery ----------
const PALM='<svg class="palm %c" viewBox="0 0 100 200"><path d="M48 200 C50 150 54 110 52 70 L56 70 C58 110 56 150 54 200Z"/><path d="M53 72 C30 50 10 55 0 70 C15 52 35 48 53 66Z M53 70 C40 40 20 30 5 35 C25 25 45 38 54 64Z M54 68 C60 35 80 25 98 30 C78 30 64 42 56 66Z M55 70 C75 50 92 55 100 72 C88 58 72 56 56 72Z M54 66 C54 40 60 20 70 8 C64 26 60 44 57 66Z"/></svg>';
const gameHTML=(cls="")=>`<div class="game ${cls}"><div class="sun"></div><div class="city"></div><div class="sea"></div>${PALM.replace("%c","l")}${PALM.replace("%c","r")}<div class="car"></div><div class="hud"></div></div>`;
const camHTML=s=>`<div class="cam" style="--skin:${s.skin};--shirt:${s.shirt}"><div class="body"></div><div class="head"></div><div class="phones"></div></div>`;

// ---------- live tiles ----------
const tilesEl=$("#tiles"); const tiles=[];
STREAMERS.slice(0,6).forEach((s,i)=>{
  const el=document.createElement("div"); el.className="tile";
  const v=ri(6000,58000);
  el.innerHTML=`${gameHTML(i%3===1?"night":"")}${camHTML(s)}<div class="ov"></div><div class="bracket"></div><div class="cprog"></div>
    <span class="lv">LIVE</span><span class="vw">${fmt(v)}</span>
    <div class="nm">${s.n}<small>Grand Theft Auto VI · FR</small></div><span class="badge"></span><div class="hype"><i></i></div>`;
  const g=el.querySelector(".car"); g.style.animationDelay=(-i*0.7)+"s"; g.style.animationDuration=(2.8+i*.4)+"s";
  tilesEl.appendChild(el);
  tiles.push({el,s,v,hype:rnd(10,35),busy:false});
});
$("#lcount").textContent="14 streams";
setInterval(()=>{
  if(paused) return;
  let tot=0;
  tiles.forEach(t=>{
    t.v+=ri(-90,260); tot+=t.v; t.el.querySelector(".vw").textContent=fmt(t.v);
    if(!t.busy) t.hype=Math.max(8,Math.min(45,t.hype+rnd(-6,6)));
    t.el.querySelector(".hype i").style.width=t.hype+"%";
  });
  $("#k-live").textContent=fmt(tot);
},260);

// ---------- clip pipeline ----------
let kClips=11, kViews=1284302;
const setK=()=>{$("#k-clips").textContent=kClips;$("#k-views").textContent=fmt(kViews)}; setK();
const clipsEl=$("#clips");
function addCard(s,idea,title,score,instant){
  const card=document.createElement("div"); card.className="card";
  if(instant) card.style.animation="none";
  card.innerHTML=`<div class="ph"><div class="top" style="--skin:${s.skin};--shirt:${s.shirt}"><div class="body"></div><div class="head"></div><div class="phones"></div></div>
    <div class="bot">${gameHTML()}</div><div class="hook">${idea.h}</div><div class="kar"></div><div class="pb"></div></div>
    <div class="info"><b>${title}</b><span class="src">src: twitch/${s.n.toLowerCase()} · 0:${ri(10,59)} · ${ri(18,34)}s</span>
    <div class="pills"><span>TIKTOK</span><span>SHORTS</span><span class="sc">CLICK ${score}/10</span></div>
    <div class="v" data-v="${instant?ri(4000,90000):0}">0<small>VIEWS</small></div></div>`;
  clipsEl.prepend(card);
  while(clipsEl.children.length>4) clipsEl.lastChild.remove();
  // karaoke
  const k=card.querySelector(".kar"), pb=card.querySelector(".pb"); let w=0;
  const step=()=>{ if(!card.isConnected) return;
    if(!paused){ const st=Math.floor(w/3)*3;
      k.innerHTML=idea.w.slice(st,st+3).map((x,j)=>`<span class="${st+j===w?"cur":""}">${x}</span>`).join(" ");
      pb.style.width=((w+1)/idea.w.length*100)+"%"; w=(w+1)%idea.w.length; }
    setTimeout(step,340); };
  step();
  // views ticking
  const vEl=card.querySelector(".v");
  const grow=()=>{ if(!card.isConnected) return;
    if(!paused){ const add=ri(20,900); const v=+vEl.dataset.v+add; vEl.dataset.v=v; vEl.firstChild.textContent=fmt(v); if(!instant){kViews+=add;setK()} }
    setTimeout(grow,rnd(200,500)); };
  grow();
}
// prefill output so the page never looks empty
[[3,3],[5,5],[1,0]].forEach(([si,ii])=>{const s=STREAMERS[si],idea=IDEAS[ii];addCard(s,idea,idea.t.replace("%s",s.n),(rnd(8,9.6)).toFixed(1),true)});

function runClip(){
  if(paused){setTimeout(runClip,500);return}
  const free=tiles.filter(t=>!t.busy); if(!free.length){setTimeout(runClip,1500);return}
  const t=pick(free); t.busy=true; const s=t.s; const idea=pick(IDEAS); const title=idea.t.replace("%s",s.n);
  const id=hex(10); const mult=rnd(5.5,11).toFixed(1); const score=rnd(8,9.7).toFixed(1); const badge=t.el.querySelector(".badge"); const cp=t.el.querySelector(".cprog");
  const at=(ms,fn)=>setTimeout(fn,ms);
  log("chat",`message rate rising on <span class="hl">${s.n}</span> · ${ri(40,90)} msg/s`);
  let h=t.hype; const ramp=setInterval(()=>{h=Math.min(100,h+9);t.hype=h},120);
  at(1000,()=>{clearInterval(ramp);t.hype=100;t.el.classList.add("spike");badge.textContent="SPIKE x"+mult;
    log("chat",`<span class="hl">SPIKE x${mult}</span> on ${s.n} · z=${rnd(4,7).toFixed(2)} · marking -25s..+5s`)});
  at(2200,()=>{t.el.classList.remove("spike");t.el.classList.add("clip");badge.textContent="CLIPPING";
    cp.style.transition="width 4.2s linear";cp.style.width="100%";
    log("twitch",`create clip broadcaster=${s.n.toLowerCase()} · id=${id} · <span class="ok">201</span>`)});
  at(2900,()=>log("crop",`detect facecam · bbox [${ri(1300,1500)},${ri(40,90)},${ri(380,440)},${ri(300,330)}] · conf 0.${ri(93,99)}`));
  at(3300,()=>log("crop",`reframe 1920x1080 -> 1080x1920 · facecam top / gameplay bottom`));
  at(3800,()=>log("whisper",`transcribe lang=fr · ${idea.w.length} words · ${rnd(.6,1.4).toFixed(2)}s`));
  at(4300,()=>log("whisper",`"${idea.w.slice(0,6).join(" ").toLowerCase()}..."`));
  at(4800,()=>log("render",`burn karaoke subs #FF3EA5 · hook "${idea.h}" · 60fps`));
  at(5400,()=>log("claude",`title -> <span class="hl">"${title}"</span>`));
  at(5800,()=>log("claude",`click score <span class="ok">${score}/10</span> · auto-approved`));
  at(6500,()=>{
    t.el.classList.remove("clip");cp.style.transition="none";cp.style.width="0";t.hype=20;t.busy=false;
    log("publish",`<span class="ok">POSTED</span> tiktok @gta6francenews · youtube shorts · clip ${id}`);
    kClips++; setK(); addCard(s,idea,title,score,false);
  });
  setTimeout(runClip, rnd(3800,5600));
}
setTimeout(runClip,1200);
log("sys",'<span class="ok">clipper engine v3 started</span> · autopilot on · human input not required');

// ---------- controls ----------
document.addEventListener("click",()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); });
document.addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault();paused=!paused;document.querySelectorAll("*").forEach(x=>x.getAnimations?.().forEach(a=>paused?a.pause():a.play()))} });
let hideT; const wake=()=>{document.body.classList.remove("nocursor");clearTimeout(hideT);hideT=setTimeout(()=>document.body.classList.add("nocursor"),2000)};
document.addEventListener("mousemove",wake); wake();
})();
</script>
</body></html>
